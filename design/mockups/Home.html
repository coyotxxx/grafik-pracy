<script data-dc-script data-props='{"accent":{"editor":"color","default":"#52D0B3","options":["#52D0B3","#7ABDFF","#DAC559","#F490D9"],"section":"Motyw"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 18 };
  }

  renderVals() {
    var self = this;
    var accent = this.props.accent || '#52D0B3';
    var T = {
      II:  { bg: 'rgba(255,147,126,0.10)', line: 'rgba(255,147,126,0.26)', ink: '#FF937E', dot: '#C1351E', text: 'zmiana popołudniowa · 14:00–22:00 · 8 h' },
      III: { bg: 'rgba(122,189,255,0.10)', line: 'rgba(122,189,255,0.26)', ink: '#7ABDFF', dot: '#3587D3', text: 'zmiana nocna · 22:00–06:00 · 8 h' },
      W:   { bg: 'rgba(255,255,255,0.035)', line: '#1F2428', ink: '#8A939B', dot: '#4E565C', text: 'dzień wolny w cyklu' }
    };
    var list = [
      { num: 18, dow: 'pt', s: 'III', name: 'piątek 18 września' },
      { num: 19, dow: 'so', s: 'W', name: 'sobota 19 września' },
      { num: 20, dow: 'nd', s: 'W', name: 'niedziela 20 września' },
      { num: 21, dow: 'pn', s: 'II', name: 'poniedziałek 21 września' },
      { num: 22, dow: 'wt', s: 'II', name: 'wtorek 22 września' }
    ];

    var next = list.map(function (d, i) {
      var t = T[d.s];
      var on = d.num === self.state.picked;
      return {
        num: d.num,
        dow: d.dow,
        label: d.s === 'W' ? 'w5' : d.s,
        aria: d.name + ' — ' + t.text,
        bg: t.bg,
        line: on ? t.line : '#1F2428',
        ink: t.ink,
        numInk: on ? '#F1F3F4' : '#C5CCD1',
        ring: on ? 'inset 0 0 0 1.5px ' + accent : 'none',
        delay: (0.78 + i * 0.06).toFixed(2) + 's',
        pick: function () { self.setState({ picked: d.num }); }
      };
    });

    var cur = list[0];
    for (var i = 0; i < list.length; i++) { if (list[i].num === this.state.picked) { cur = list[i]; } }

    return {
      next: next,
      sel: { dot: T[cur.s].dot, text: cur.name + ' · ' + T[cur.s].text }
    };
  }
}
</script>
