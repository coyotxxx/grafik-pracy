<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F6F2; color-scheme: light; }
    a { color: #00876D; }
    a:hover { color: #006B56; }
    button { font-family: inherit; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes cellIn { from { opacity: 0; transform: translateY(10px) scale(0.94); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { width: 0; } to { width: 59%; } }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(0,-18px,0) scale(1.08); } }
    @keyframes todayPulse {
      0%, 100% { box-shadow: inset 0 0 0 1.5px rgba(0,135,109,0.85), 0 0 0 0 rgba(0,135,109,0.18); }
      50% { box-shadow: inset 0 0 0 1.5px rgba(0,135,109,0.45), 0 0 14px 2px rgba(0,135,109,0.14); }
    }
    .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
    .cell { animation: cellIn .5s cubic-bezier(.22,1,.36,1) both; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
    .cell:active { transform: scale(0.93); }
    .today { animation: cellIn .5s cubic-bezier(.22,1,.36,1) both, todayPulse 3.2s ease-in-out 1s infinite; }
    .bar { animation: grow 1.3s cubic-bezier(.22,1,.36,1) .3s both; }
    .halo { animation: drift 18s ease-in-out infinite alternate; }
    .tap { transition: transform .16s ease, background .16s ease; }
    .tap:active { transform: scale(0.95); }
    @media (prefers-reduced-motion: reduce) { .rise, .cell, .today, .bar, .halo { animation: none !important; } .bar { width: 59%; } }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #15181A; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; overflow: hidden; pointer-events: none;">
    <div class="halo" style="position: absolute; top: -230px; left: -110px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(53,135,211,0.16) 0%, rgba(53,135,211,0.05) 48%, rgba(53,135,211,0) 72%);"></div>
    <div class="halo" style="position: absolute; bottom: -240px; right: -150px; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle, rgba(0,135,109,0.12) 0%, rgba(0,135,109,0) 70%); animation-duration: 23s;"></div>
  </div>

  <div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 44px 0 0 0;">

    <div class="rise" style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;">Wrzesień <span style="color: #9B9F9A;">2026</span></h1>
          <p style="margin: 0; font-size: 11px; color: #5A6169; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Brygada A · 3-zmianowy · rotacja tygodniowa</p>
        </div>
        <div style="display: flex; gap: 4px; flex-shrink: 0;">
          <button type="button" class="tap" aria-label="Poprzedni miesiąc" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E4E2DB; border-radius: 13px; color: #3E454C; cursor: pointer;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
          </button>
          <button type="button" class="tap" aria-label="Następny miesiąc" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E4E2DB; border-radius: 13px; color: #3E454C; cursor: pointer;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E8E6DF; border-radius: 18px; box-shadow: 0 6px 20px rgba(21,24,26,0.05);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
          <span style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">{{count}}</span>
            <span style="font-size: 13px; font-weight: 500; color: #5A6169;">/ 176 h</span>
          </span>
          <span style="font-size: 11px; color: #5A6169;">do dziś</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: #ECEAE3; display: flex; overflow: hidden;">
          <div class="bar" style="width: 59%; border-radius: 999px; background: {{accent}};"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: #5A6169;">
          <span>cały miesiąc 176 h · bilans 0 h</span>
          <span>urlop 16 h</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px;">
      <div class="rise" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; animation-delay: .1s;">
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #5A6169;">PN</span>
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #5A6169;">WT</span>
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #5A6169;">ŚR</span>
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #5A6169;">CZ</span>
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #5A6169;">PT</span>
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #8A9099;">SO</span>
        <span style="text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #8A9099;">ND</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{days}}" as="day" hint-placeholder-count="42">
          <button type="button" class="{{day.cls}}" onClick="{{day.pick}}" aria-label="{{day.aria}}" style="height: 62px; box-sizing: border-box; padding: 7px 6px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; cursor: pointer; border-radius: 14px; background: {{day.bg}}; border: 1px solid {{day.line}}; box-shadow: {{day.ring}}; animation-delay: {{day.delay}};">
            <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 2px;">
              <span style="font-size: 13px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: {{day.numInk}};">{{day.num}}</span>
              <span style="font-size: 9px; font-weight: 500; line-height: 1; color: #8A9099;">{{day.hours}}</span>
            </span>
            <span style="font-size: 13px; font-weight: 700; line-height: 1; letter-spacing: 0.06em; color: {{day.ink}};">{{day.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="rise" style="display: flex; align-items: center; gap: 12px; margin: 2px 16px 0; padding: 10px 12px; background: #FFFFFF; border: 1px solid #E8E6DF; border-radius: 18px; box-shadow: 0 8px 24px rgba(21,24,26,0.06); animation-delay: .9s;">
      <span style="width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; background: {{sel.bg}}; border: 1px solid {{sel.line}}; color: {{sel.ink}};">{{sel.badge}}</span>
      <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 13px; font-weight: 600;">{{sel.title}}</span>
        <span style="font-size: 11px; color: #5A6169;">{{sel.meta}}</span>
      </span>
      <a href="Day.dc.html" class="tap" aria-label="Szczegóły dnia" style="flex-shrink: 0; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #E7F2EE; border: 1px solid #CADFD8; text-decoration: none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </div>

    <div class="rise" style="display: flex; gap: 8px; margin: 0 16px; animation-delay: .95s;">
      <a href="Edit.dc.html" class="tap" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E2DB; color: #15181A; font-size: 13px; font-weight: 600; text-decoration: none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.8 2.8 0 1 0-4-4L4 16v4z"></path></svg>
        Edytuj grafik
      </a>
      <button type="button" class="tap" aria-label="Filtr i widok" style="width: 46px; height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E2DB; color: #3E454C; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
      </button>
    </div>

    <nav style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 10px 18px; background: #FFFFFF; border-top: 1px solid #E8E6DF;">
      <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 48px; padding: 6px 0; border-radius: 13px; text-decoration: none; color: #5A6169;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
        <span style="font-size: 10px; font-weight: 600;">Teraz</span>
      </a>
      <a href="Month-Light.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 48px; padding: 6px 0; border-radius: 13px; text-decoration: none; background: #E7F2EE; color: {{accent}};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18"></path></svg>
        <span style="font-size: 10px; font-weight: 600;">Grafik</span>
      </a>
      <a href="Summary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 48px; padding: 6px 0; border-radius: 13px; text-decoration: none; color: #5A6169;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 20v-6M12 20V7M17 20v-9"></path></svg>
        <span style="font-size: 10px; font-weight: 600;">Bilans</span>
      </a>
      <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 48px; padding: 6px 0; border-radius: 13px; text-decoration: none; color: #5A6169;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14M6 16h14"></path><circle cx="9" cy="8" r="2.6"></circle><circle cx="16" cy="16" r="2.6"></circle></svg>
        <span style="font-size: 10px; font-weight: 600;">Ustawienia</span>
      </a>
    </nav>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#00876D","options":["#00876D","#3587D3","#AE9400","#C04CA5"],"section":"Motyw"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 17, count: 0 };
  }

  componentDidMount() {
    var self = this;
    var start = null;
    var step = function (ts) {
      if (start === null) { start = ts; }
      var p = Math.min(1, (ts - start) / 1100);
      var eased = 1 - Math.pow(1 - p, 3);
      self.setState({ count: Math.round(104 * eased) });
      if (p < 1) { self.raf = requestAnimationFrame(step); }
    };
    this.raf = requestAnimationFrame(step);
  }

  componentWillUnmount() {
    if (this.raf) { cancelAnimationFrame(this.raf); }
  }

  renderVals() {
    var self = this;
    var accent = this.props.accent || '#00876D';
    var T = {
      I:   { bg: 'rgba(174,148,0,0.10)',  line: 'rgba(174,148,0,0.28)',  ink: '#7C6800' },
      II:  { bg: 'rgba(193,53,30,0.09)',  line: 'rgba(193,53,30,0.24)',  ink: '#AB331F' },
      III: { bg: 'rgba(53,135,211,0.10)', line: 'rgba(53,135,211,0.26)', ink: '#0465AF' },
      U:   { bg: 'rgba(192,76,165,0.09)', line: 'rgba(192,76,165,0.24)', ink: '#9C3084' },
      W:   { bg: '#EFEDE7',               line: '#E4E2DB',               ink: '#6B7178' }
    };
    var INFO = {
      I: 'Zmiana ranna · 06:00–14:00 · 8 h',
      II: 'Zmiana popołudniowa · 14:00–22:00 · 8 h',
      III: 'Zmiana nocna · 22:00–06:00 · 8 h',
      U: 'Urlop wypoczynkowy · 8 h',
      W: 'Dzień wolny w cyklu'
    };
    var NAMES = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota', 'Niedziela'];
    var plan = [
      { d: 31, out: true },
      { d: 1, s: 'II', h: true }, { d: 2, s: 'II', h: true }, { d: 3, s: 'II', h: true }, { d: 4, s: 'II', h: true }, { d: 5, s: 'W' }, { d: 6, s: 'W' },
      { d: 7, s: 'I', h: true }, { d: 8, s: 'I', h: true }, { d: 9, s: 'I', h: true }, { d: 10, s: 'I', h: true }, { d: 11, s: 'U' }, { d: 12, s: 'W' }, { d: 13, s: 'W' },
      { d: 14, s: 'U' }, { d: 15, s: 'III', h: true }, { d: 16, s: 'III', h: true }, { d: 17, s: 'III', today: true }, { d: 18, s: 'III' }, { d: 19, s: 'W' }, { d: 20, s: 'W' },
      { d: 21, s: 'II' }, { d: 22, s: 'II' }, { d: 23, s: 'II' }, { d: 24, s: 'II' }, { d: 25, s: 'II' }, { d: 26, s: 'W' }, { d: 27, s: 'W' },
      { d: 28, s: 'I' }, { d: 29, s: 'I' }, { d: 30, s: 'I' }, { d: 1, s: 'I', out: true }, { d: 2, s: 'I', out: true }, { d: 3, s: 'W', out: true }, { d: 4, s: 'W', out: true }
    ];

    var days = plan.map(function (p, i) {
      var t = T[p.s] || { bg: 'transparent', line: '#EDEBE4', ink: '#A9AEB3' };
      var picked = !p.out && p.d === self.state.picked;
      return {
        num: p.d,
        hours: p.h ? '8h' : '',
        label: p.out ? '' : (p.s === 'W' ? 'w5' : (p.s || '')),
        aria: p.d + ' — ' + (INFO[p.s] || 'inny miesiąc'),
        cls: p.today ? 'today' : 'cell',
        bg: p.out ? 'transparent' : t.bg,
        line: p.out ? '#EDEBE4' : t.line,
        ink: p.out ? '#A9AEB3' : t.ink,
        numInk: p.out ? '#A9AEB3' : (p.s === 'W' ? '#5A6169' : '#15181A'),
        ring: picked ? 'inset 0 0 0 1.5px ' + accent : 'none',
        delay: (0.16 + i * 0.016).toFixed(3) + 's',
        pick: function () { if (!p.out) { self.setState({ picked: p.d }); } }
      };
    });

    var idx = 0;
    for (var j = 1; j < plan.length; j++) {
      if (!plan[j].out && plan[j].d === this.state.picked) { idx = j; break; }
    }
    var cur = plan[idx];
    var ct = T[cur.s] || T.W;

    return {
      accent: accent,
      count: this.state.count,
      days: days,
      sel: {
        badge: cur.s === 'W' ? 'w5' : cur.s,
        bg: ct.bg,
        line: ct.line,
        ink: ct.ink,
        title: NAMES[idx % 7] + ', ' + cur.d + ' września',
        meta: INFO[cur.s] || ''
      }
    };
  }
}
</script>
</body>
</html>
